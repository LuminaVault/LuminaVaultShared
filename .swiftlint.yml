included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData

line_length:
  warning: 120
  ignores_urls: true
  ignores_comments: true

identifier_name:
  # Short locals (c, v, p) are idiomatic in Codable init(from:) and closures.
  min_length: 1
  excluded:
    - id
    - x
    - y
    # Wire-format names consumers already use; renaming breaks them.
    - tool_calls
    - tool_choice

opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - unused_import

disabled_rules:
  - trailing_whitespace
